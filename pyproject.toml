[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raspyCode"
version = "0.1.0"
description = "Agente locale a microservizi asyncio per bioinformatica con interfaccia Textual"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "noya", email = "noya@local.it" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "textual>=0.80.0",  # Interfaccia utente full-screen
    "httpx>=0.24.0",    # Client HTTP asincrono per Ollama ed healthcheck
    "rich>=13.0.0",     # Dipendenza nativa di Textual / BioPipeLine
    "numpy>=1.24.0",    # Calcolo vettoriale (RAGService: similarita' coseno)
]

[project.optional-dependencies]
# Estensioni facoltative da compilare solo sul Raspberry Pi con TFT
tft = [
    "pillow>=9.5.0",
]

dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
]

# Esposizione facoltativa di bioCli come server MCP (mcp_server.py, TODO punto 9).
# ATTENZIONE: dalla v2 l'SDK ufficiale ha rifatto l'API e rimosso
# mcp.server.fastmcp; mcp_server.py e' scritto contro la v1.x, quindi il pin
# <2 e' necessario finche' non viene migrato (vedi note SDK ufficiale).
mcp = [
    "mcp>=1.28,<2",
]

[project.scripts]
raspycode = "raspyCode.main:start"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["raspyCode", "raspyCode.*"]
# bioCli e' un sottopacchetto vero (funzioni pure importate in-process da
# ToolExecutorService), quindi deve restare incluso: niente exclude qui.
# (In precedenza bioCli era un albero di script CLI standalone eseguiti via
# subprocess, da cui l'esclusione storica — non piu' valida col refactor
# a funzioni pure.)

[tool.coverage.run]
source = ["raspyCode"]
omit = [
    "raspyCode/main.py",
    "raspyCode/ui/*",
    "raspyCode/services/connectivity_service.py",
    "raspyCode/services/llm_gateway_service.py",
    "raspyCode/services/system_stats_service.py"
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "N999", "BLE001"]

[tool.ruff.lint.per-file-ignores]
"raspyCode/ui/banner.py" = ["W291"]

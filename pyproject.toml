[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raspyCode"
version = "0.1.0"
description = "Agente locale a microservizi asyncio per bioinformatica con interfaccia Textual"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "noya", email = "noya@local.it" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "textual>=0.80.0",  # Interfaccia utente full-screen
    "httpx>=0.24.0",    # Client HTTP asincrono per Ollama ed healthcheck
    "rich>=13.0.0",     # Dipendenza nativa di Textual / BioPipeLine
    "biopython>=1.80",  # Core parsing genomico per gli script bioCli
    "pandas>=2.0.0",    # Utilizzato da blastOutput.py
]

[project.optional-dependencies]
# Estensioni facoltative da compilare solo sul Raspberry Pi con TFT
tft = [
    "numpy>=1.24.0",
    "pillow>=9.5.0",
]

[project.scripts]
raspycode = "raspyCode.main:start"

[tool.setuptools.packages.find]
where = ["."]
include = ["raspyCode", "raspyCode.*"]
exclude = ["raspyCode.bioCli*"] # Evita che gli script CLI standalone vengano trattati come sotto-pacchetti di libreria
